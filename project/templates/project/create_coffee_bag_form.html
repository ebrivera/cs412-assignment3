{% extends 'project/base.html' %}

{% block content %}

<h1>Add your latest Coffee Bag</h1>

    <form action="{% url 'create_coffee_bag' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <h2>User Account Creation</h2>
        <table>
            {{ form.as_table}}
        </table>

        <input type="submit" name="submit" value="Submit">
    </form>
{% endblock %}
