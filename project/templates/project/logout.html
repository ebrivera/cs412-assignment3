{% extends 'project/base.html' %}

{% block content %}

<h1>Logout of BrewReview</h1>
<form method="post" action="{% url 'login' %}" >
    {% csrf_token %}
    {{form}}
    <input type="submit" value="Login">
    <input type="hidden" name="next" value="{% url 'show_all_profiles' %}">
</form>
{% endblock %}
