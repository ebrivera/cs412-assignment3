{% extends 'project/base.html' %}

{% block content %}

<h1>Login to BrewReview</h1>
<form method="post" action="{% url 'login' %}" >
    {% csrf_token %}
    {{form}}
    <input type="submit" value="Login">
    <input type="hidden" name="next" value="{% url 'show_all_coffees' %}">
</form>
<hr>
Don't have an account? <a href="{% url 'create_coffee_enthusiast' %}">Register here</a>.
{% endblock %}
